<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gang Pool Manager v5 Shared</title>
  <style>
    :root {
      --bg:#090c12; --panel:#151a24; --panel2:#1d2431; --line:#2c3648;
      --text:#f5f7ff; --muted:#aab4c8; --accent:#8b4df4; --accent2:#6f35da;
      --danger:#ef4444; --success:#22c55e; --warning:#f59e0b;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif;
    }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    .wrap { width:min(1100px,calc(100% - 28px)); margin:0 auto; }
    header { padding:18px 0 8px; }
    .head-grid { display:grid; grid-template-columns:1fr 260px; gap:18px; align-items:start; }
    h1 { margin:0 0 6px; font-size:28px; }
    .subtitle { color:var(--muted); margin:0; }
    .status { margin-top:10px; display:flex; align-items:center; gap:8px; color:var(--muted); font-size:14px; }
    .dot { width:10px; height:10px; border-radius:50%; background:var(--warning); }
    .status.ok .dot { background:var(--success); }
    .status.error .dot { background:var(--danger); }
    .balance {
      background:linear-gradient(135deg,var(--accent),var(--accent2)); border-radius:16px;
      padding:15px 20px; min-height:82px;
    }
    .balance small { display:block; opacity:.9; }
    .balance strong { display:block; font-size:29px; margin-top:4px; }
    .tabs { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:10px 0 18px; }
    .tab-btn {
      border:1px solid var(--line); background:var(--panel); color:var(--text);
      border-radius:12px; padding:13px 8px;
    }
    .tab-btn.active { background:var(--accent); border-color:var(--accent); }
    .page { display:none; }
    .page.active { display:block; }
    .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .grid3 { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
    .card {
      background:var(--panel); border:1px solid var(--line); border-radius:16px;
      padding:18px; margin-bottom:16px;
    }
    .card h2,.card h3 { margin:0 0 15px; }
    label { display:block; color:var(--muted); margin-bottom:7px; font-size:14px; }
    input,select {
      width:100%; color:var(--text); background:var(--panel2); border:1px solid var(--line);
      border-radius:10px; padding:12px 13px; outline:none;
    }
    input:focus,select:focus { border-color:var(--accent); }
    .row { display:flex; gap:8px; align-items:center; }
    .row input,.row select { flex:1; }
    .btn {
      border:0; border-radius:10px; padding:12px 16px; color:white;
      background:var(--accent); white-space:nowrap;
    }
    .btn:hover { background:var(--accent2); }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .btn.secondary { background:#30394a; }
    .btn.danger { background:var(--danger); }
    .btn.full { width:100%; }
    .checks { display:grid; grid-template-columns:repeat(auto-fill,minmax(145px,1fr)); gap:8px; }
    .check {
      display:flex; gap:8px; align-items:center; background:var(--panel2);
      border:1px solid var(--line); border-radius:10px; padding:10px;
    }
    .check input { width:auto; }
    .result-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    .result { background:var(--panel2); border-radius:12px; padding:13px; }
    .result span { display:block; color:var(--muted); font-size:13px; }
    .result strong { display:block; margin-top:4px; font-size:20px; }
    .list { display:grid; gap:8px; }
    .list-row {
      background:var(--panel2); border:1px solid var(--line); border-radius:10px;
      padding:11px 12px; display:flex; justify-content:space-between; gap:12px; align-items:center;
    }
    .muted { color:var(--muted); }
    .history { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:13px; }
    .history + .history { margin-top:10px; }
    .history-head { display:flex; justify-content:space-between; gap:12px; }
    .plus { color:var(--success); }
    .minus { color:#fb7185; }
    .rank-row { display:grid; grid-template-columns:42px 1fr auto; gap:10px; align-items:center;
      background:var(--panel2); border-radius:10px; padding:10px 12px; margin-bottom:8px; }
    .rank-num { width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#30394a; }
    .periods { display:flex; gap:8px; margin-bottom:14px; }
    .period-btn { border:1px solid var(--line); background:var(--panel2); color:var(--text); border-radius:9px; padding:9px 13px; }
    .period-btn.active { background:var(--accent); border-color:var(--accent); }
    .message { display:none; margin:0 auto 14px; padding:12px 15px; border-radius:12px; }
    .message.show { display:block; }
    .message.success { background:#12351f; border:1px solid #238448; }
    .message.error { background:#3b1519; border:1px solid #a82f3a; }
    .empty { color:var(--muted); padding:12px 0; }
    @media(max-width:800px) {
      .head-grid,.grid2,.grid3 { grid-template-columns:1fr; }
      .tabs { grid-template-columns:1fr 1fr; }
      .result-grid { grid-template-columns:1fr 1fr; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <div class="head-grid">
      <div>
        <h1>Gang Pool Manager v5 Shared</h1>
        <p class="subtitle">犯罪利益・メンバー報酬・ギャングプール管理</p>
        <div id="syncStatus" class="status">
          <span class="dot"></span><span id="syncText">Supabaseへ接続中…</span>
        </div>
      </div>
      <div class="balance">
        <small>現在のプール残高</small>
        <strong id="headerBalance">¥0</strong>
      </div>
    </div>
  </header>

  <div id="message" class="message wrap"></div>

  <main class="wrap">
    <nav class="tabs">
      <button class="tab-btn active" data-page="calc">犯罪利益計算</button>
      <button class="tab-btn" data-page="pool">ギャングプール</button>
      <button class="tab-btn" data-page="ranking">ランキング</button>
      <button class="tab-btn" data-page="settings">事前登録・設定</button>
    </nav>

    <section id="calc" class="page active">
      <div class="grid2">
        <div class="card">
          <h2>犯罪情報</h2>
          <label>犯罪種類</label>
          <select id="crimeSelect"></select>
          <div style="height:12px"></div>
          <label>利確金額</label>
          <input id="gross" type="number" min="0" placeholder="0">
          <div style="height:12px"></div>
          <label>罰金総額</label>
          <input id="fine" type="number" min="0" placeholder="0">
          <div style="height:12px"></div>
          <label>プール取り分（口数）</label>
          <input id="poolShares" type="number" min="0" value="1">
        </div>
        <div class="card">
          <h2>参加メンバー</h2>
          <div id="participants" class="checks"></div>
          <h3 style="margin-top:18px">逮捕されたメンバー</h3>
          <div id="arrested" class="checks"></div>
        </div>
      </div>

      <div class="card">
        <h2>計算結果</h2>
        <div class="result-grid">
          <div class="result"><span>純利益</span><strong id="netOut">¥0</strong></div>
          <div class="result"><span>合計口数</span><strong id="sharesOut">0口</strong></div>
          <div class="result"><span>一人あたり</span><strong id="perOut">¥0</strong></div>
          <div class="result"><span>プール入金</span><strong id="poolOut">¥0</strong></div>
        </div>
        <h3 style="margin-top:18px">メンバー報酬</h3>
        <div id="rewardList" class="list"></div>
        <div style="height:14px"></div>
        <button id="saveCrime" class="btn full">犯罪記録を保存してプールへ入金</button>
      </div>

      <div class="card">
        <h2>犯罪記録</h2>
        <div id="crimeHistory"></div>
      </div>
    </section>

    <section id="pool" class="page">
      <div class="grid2">
        <div class="card">
          <h2>手動入金</h2>
          <label>金額</label><input id="depositAmount" type="number" min="0">
          <div style="height:10px"></div>
          <label>理由</label><input id="depositReason" placeholder="例：個人入金">
          <div style="height:12px"></div>
          <button id="depositBtn" class="btn full">プールへ入金</button>
        </div>
        <div class="card">
          <h2>出金</h2>
          <label>金額</label><input id="withdrawAmount" type="number" min="0">
          <div style="height:10px"></div>
          <label>理由</label><input id="withdrawReason" placeholder="例：装備購入">
          <div style="height:10px"></div>
          <label>担当メンバー</label><select id="withdrawMember"></select>
          <div style="height:12px"></div>
          <button id="withdrawBtn" class="btn danger full">プールから出金</button>
        </div>
      </div>
      <div class="card">
        <h2>入出金履歴</h2>
        <div id="poolHistory"></div>
      </div>
    </section>

    <section id="ranking" class="page">
      <div class="card">
        <div class="periods">
          <button class="period-btn active" data-period="all">総合</button>
          <button class="period-btn" data-period="7d">直近7日</button>
        </div>
        <p id="rankingNote" class="muted"></p>
      </div>
      <div class="grid3">
        <div class="card"><h2>逮捕数</h2><div id="arrestRank"></div></div>
        <div class="card"><h2>犯罪参加数</h2><div id="successRank"></div></div>
        <div class="card"><h2>プール貢献</h2><div id="poolRank"></div></div>
      </div>
    </section>

    <section id="settings" class="page">
      <div class="grid2">
        <div class="card">
          <h2>メンバー登録</h2>
          <div class="row">
            <input id="memberName" placeholder="メンバー名">
            <button id="addMember" class="btn">＋追加</button>
          </div>
          <div style="height:14px"></div>
          <div id="memberList" class="list"></div>
        </div>
        <div class="card">
          <h2>犯罪種類登録</h2>
          <div class="row">
            <input id="crimeName" placeholder="犯罪名">
            <button id="addCrime" class="btn">＋追加</button>
          </div>
          <div style="height:14px"></div>
          <div id="crimeList" class="list"></div>
        </div>
      </div>
      <div class="card">
        <h2>データ管理</h2>
        <p class="muted">この操作はSupabase上の共有データを全削除します。</p>
        <button id="resetAll" class="btn danger">全データを初期化</button>
      </div>
    </section>
  </main>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://hufgikfjmieckujjpogh.supabase.co";
  const SUPABASE_KEY = "sb_publishable_QSa1VTXIKwFPa7UO_9AHog_AneCwZ2b";
  const API = `${SUPABASE_URL}/rest/v1`;

  const state = {
    members: [],
    crimes: [],
    crimeRecords: [],
    poolTransactions: [],
    poolBalance: 0,
    rankingPeriod: "all"
  };

  const $ = id => document.getElementById(id);
  const yen = n => "¥" + Math.floor(Number(n) || 0).toLocaleString("ja-JP");
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
  const fmtDate = v => new Date(v).toLocaleString("ja-JP");

  function setStatus(kind, text) {
    const box = $("syncStatus");
    box.className = "status" + (kind ? " " + kind : "");
    $("syncText").textContent = text;
  }

  function showMessage(text, kind="success") {
    const box = $("message");
    box.textContent = text;
    box.className = `message wrap show ${kind}`;
    clearTimeout(showMessage.timer);
    showMessage.timer = setTimeout(() => box.className = "message wrap", 5000);
  }

  async function request(table, options={}) {
    const method = options.method || "GET";
    const query = options.query ? "?" + options.query : "";
    const headers = {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      Accept: "application/json"
    };
    if (method !== "GET") {
      headers["Content-Type"] = "application/json";
      headers["Prefer"] = "return=representation";
    }

    const res = await fetch(`${API}/${table}${query}`, {
      method,
      headers,
      body: options.body ? JSON.stringify(options.body) : undefined
    });
    const text = await res.text();
    let data = [];
    if (text) {
      try { data = JSON.parse(text); } catch { data = text; }
    }
    if (!res.ok) {
      const message = data?.message || data?.details || `${res.status} ${res.statusText}`;
      throw new Error(message);
    }
    return data;
  }

  async function loadAll() {
    setStatus("", "共有データを同期中…");
    try {
      const [members, crimes, records, txs] = await Promise.all([
        request("members", {query:"select=*&order=created_at.asc"}),
        request("crime_types", {query:"select=*&order=created_at.asc"}),
        request("crime_records", {query:"select=*&order=created_at.asc"}),
        request("pool_transactions", {query:"select=*&order=created_at.asc"})
      ]);
      state.members = members || [];
      state.crimes = crimes || [];
      state.crimeRecords = records || [];
      state.poolTransactions = txs || [];
      state.poolBalance = state.poolTransactions.reduce((sum,t) =>
        sum + (t.transaction_type === "deposit" ? Number(t.amount) : -Number(t.amount)), 0);
      renderAll();
      setStatus("ok", "共有データ同期済み");
    } catch (e) {
      console.error(e);
      setStatus("error", "接続エラー");
      showMessage("Supabase接続エラー：" + e.message, "error");
    }
  }

  function renderAll() {
    $("headerBalance").textContent = yen(state.poolBalance);

    $("crimeSelect").innerHTML = state.crimes.length
      ? state.crimes.map(c => `<option value="${esc(c.name)}">${esc(c.name)}</option>`).join("")
      : '<option value="">犯罪種類を登録してください</option>';

    $("withdrawMember").innerHTML = '<option value="">未選択</option>' +
      state.members.map(m => `<option value="${esc(m.name)}">${esc(m.name)}</option>`).join("");

    const checks = state.members.length
      ? state.members.map(m => `<label class="check"><input type="checkbox" value="${esc(m.name)}"><span>${esc(m.name)}</span></label>`).join("")
      : '<div class="empty">メンバーを登録してください</div>';
    $("participants").innerHTML = checks;
    $("arrested").innerHTML = checks;

    $("memberList").innerHTML = state.members.length
      ? state.members.map(m => `<div class="list-row"><span>${esc(m.name)}</span><button class="btn danger delete-member" data-id="${m.id}">削除</button></div>`).join("")
      : '<div class="empty">登録メンバーなし</div>';

    $("crimeList").innerHTML = state.crimes.length
      ? state.crimes.map(c => `<div class="list-row"><span>${esc(c.name)}</span><button class="btn danger delete-crime" data-id="${c.id}">削除</button></div>`).join("")
      : '<div class="empty">登録犯罪なし</div>';

    renderCrimeHistory();
    renderPoolHistory();
    renderRankings();
    calculate();
  }

  function selected(id) {
    return [...$(id).querySelectorAll('input[type="checkbox"]:checked')].map(x => x.value);
  }

  function calculate() {
    const gross = Math.max(0, Number($("gross").value) || 0);
    const fine = Math.max(0, Number($("fine").value) || 0);
    const members = selected("participants");
    const poolShares = Math.max(0, Number($("poolShares").value) || 0);
    const net = Math.max(0, gross - fine);
    const totalShares = members.length + poolShares;
    const perPerson = totalShares ? Math.floor(net / totalShares) : 0;
    const remainder = net - perPerson * totalShares;
    const poolDeposit = perPerson * poolShares + remainder;

    $("netOut").textContent = yen(net);
    $("sharesOut").textContent = totalShares + "口";
    $("perOut").textContent = yen(perPerson);
    $("poolOut").textContent = yen(poolDeposit);
    $("rewardList").innerHTML = members.length
      ? members.map(n => `<div class="list-row"><span>${esc(n)}</span><strong>${yen(perPerson)}</strong></div>`).join("")
      : '<div class="empty">参加メンバーを選択してください</div>';

    return {
      crime:$("crimeSelect").value, gross, fine, net, participants:members,
      arrested:selected("arrested"), poolShares, totalShares, perPerson, remainder, poolDeposit
    };
  }

  async function withBusy(button, text, fn) {
    const original = button.textContent;
    button.disabled = true;
    button.textContent = text;
    try { await fn(); }
    catch(e) { console.error(e); showMessage(e.message, "error"); }
    finally { button.disabled = false; button.textContent = original; }
  }

  async function addMember() {
    const name = $("memberName").value.trim();
    if (!name) return showMessage("メンバー名を入力してください。", "error");
    if (state.members.some(m => m.name === name)) return showMessage("同じメンバー名があります。", "error");
    await request("members", {method:"POST", body:{name}});
    $("memberName").value = "";
    await loadAll();
    showMessage(`「${name}」を追加しました。`);
  }

  async function addCrime() {
    const name = $("crimeName").value.trim();
    if (!name) return showMessage("犯罪名を入力してください。", "error");
    if (state.crimes.some(c => c.name === name)) return showMessage("同じ犯罪名があります。", "error");
    await request("crime_types", {method:"POST", body:{name}});
    $("crimeName").value = "";
    await loadAll();
    showMessage(`「${name}」を追加しました。`);
  }

  async function saveCrime() {
    const c = calculate();
    if (!c.crime) throw new Error("犯罪種類を登録・選択してください。");
    if (!c.participants.length) throw new Error("参加メンバーを選択してください。");
    if (c.gross <= 0) throw new Error("利確金額を入力してください。");
    if (c.net <= 0) throw new Error("純利益が0円以下です。");

    await request("crime_records", {method:"POST", body:{
      crime:c.crime, participants:c.participants, arrested:c.arrested,
      gross:c.gross, fine:c.fine, net:c.net, pool_shares:c.poolShares,
      total_shares:c.totalShares, per_person:c.perPerson,
      pool_deposit:c.poolDeposit, remainder:c.remainder
    }});

    if (c.poolDeposit > 0) {
      await request("pool_transactions", {method:"POST", body:{
        transaction_type:"deposit", amount:c.poolDeposit,
        reason:`${c.crime} プール分`, member:"",
        balance_after:state.poolBalance + c.poolDeposit
      }});
    }
    $("gross").value = "";
    $("fine").value = "";
    await loadAll();
    showMessage("犯罪記録を保存し、プールへ入金しました。");
  }

  async function poolTransaction(type) {
    const isDeposit = type === "deposit";
    const amount = Math.floor(Number($(isDeposit ? "depositAmount" : "withdrawAmount").value) || 0);
    const reason = $(isDeposit ? "depositReason" : "withdrawReason").value.trim() || "理由なし";
    const member = isDeposit ? "" : $("withdrawMember").value;
    if (amount <= 0) throw new Error("正しい金額を入力してください。");
    if (!isDeposit && amount > state.poolBalance) throw new Error("プール残高が不足しています。");
    await request("pool_transactions", {method:"POST", body:{
      transaction_type:type, amount, reason, member,
      balance_after:state.poolBalance + (isDeposit ? amount : -amount)
    }});
    $(isDeposit ? "depositAmount" : "withdrawAmount").value = "";
    $(isDeposit ? "depositReason" : "withdrawReason").value = "";
    await loadAll();
    showMessage(isDeposit ? "入金しました。" : "出金しました。");
  }

  function renderCrimeHistory() {
    $("crimeHistory").innerHTML = state.crimeRecords.length
      ? [...state.crimeRecords].reverse().map(r => `<div class="history">
          <div class="history-head"><strong>${esc(r.crime)}</strong><span class="muted">${fmtDate(r.created_at)}</span></div>
          <div class="muted">参加：${(r.participants||[]).map(esc).join("、") || "なし"}</div>
          <div class="muted">逮捕：${(r.arrested||[]).map(esc).join("、") || "なし"}</div>
          <div>純利益 ${yen(r.net)} ／ 一人 ${yen(r.per_person)} ／ プール ${yen(r.pool_deposit)}</div>
        </div>`).join("")
      : '<div class="empty">犯罪記録はまだありません</div>';
  }

  function renderPoolHistory() {
    let running = 0;
    const rows = state.poolTransactions.map(t => {
      running += t.transaction_type === "deposit" ? Number(t.amount) : -Number(t.amount);
      return {...t, running};
    });
    $("poolHistory").innerHTML = rows.length
      ? rows.reverse().map(t => `<div class="history">
          <div class="history-head"><strong class="${t.transaction_type==="deposit"?"plus":"minus"}">${t.transaction_type==="deposit"?"+":"-"}${yen(t.amount)}</strong><span class="muted">${fmtDate(t.created_at)}</span></div>
          <div>${esc(t.reason)}</div><div class="muted">処理後残高：${yen(t.running)}</div>
        </div>`).join("")
      : '<div class="empty">入出金履歴はまだありません</div>';
  }

  function renderRankings() {
    let records = state.crimeRecords;
    if (state.rankingPeriod === "7d") {
      const cutoff = Date.now() - 7*24*60*60*1000;
      records = records.filter(r => new Date(r.created_at).getTime() >= cutoff);
    }
    const stats = {};
    state.members.forEach(m => stats[m.name] = {arrests:0,success:0,pool:0});
    records.forEach(r => {
      (r.participants||[]).forEach(n => {
        stats[n] ??= {arrests:0,success:0,pool:0};
        stats[n].success++;
      });
      (r.arrested||[]).forEach(n => {
        stats[n] ??= {arrests:0,success:0,pool:0};
        stats[n].arrests++;
      });
      const list = r.participants || [];
      if (list.length) {
        const each = Math.floor(Number(r.pool_deposit || 0) / list.length);
        list.forEach(n => {
          stats[n] ??= {arrests:0,success:0,pool:0};
          stats[n].pool += each;
        });
      }
    });
    $("rankingNote").textContent = `${state.rankingPeriod==="all"?"総合":"直近7日"}・${records.length}件を集計`;
    const render = (key, format) => Object.entries(stats)
      .sort((a,b) => b[1][key]-a[1][key] || a[0].localeCompare(b[0],"ja"))
      .map(([name,v],i) => `<div class="rank-row"><span class="rank-num">${i+1}</span><span>${esc(name)}</span><strong>${format(v[key])}</strong></div>`).join("")
      || '<div class="empty">データなし</div>';
    $("arrestRank").innerHTML = render("arrests", v => v+"回");
    $("successRank").innerHTML = render("success", v => v+"回");
    $("poolRank").innerHTML = render("pool", yen);
  }

  async function deleteRow(table,id) {
    await request(table, {method:"DELETE", query:`id=eq.${encodeURIComponent(id)}`});
    await loadAll();
  }

  async function resetAll() {
    if (!confirm("共有データをすべて削除しますか？")) return;
    const word = prompt('確認のため「全削除」と入力してください。');
    if (word !== "全削除") return;
    for (const table of ["pool_transactions","crime_records","crime_types","members"]) {
      await request(table, {method:"DELETE", query:"id=not.is.null"});
    }
    await loadAll();
    showMessage("共有データを全削除しました。");
  }

  function bind() {
    document.querySelectorAll(".tab-btn").forEach(btn => btn.addEventListener("click", () => {
      document.querySelectorAll(".tab-btn").forEach(x => x.classList.toggle("active", x===btn));
      document.querySelectorAll(".page").forEach(x => x.classList.toggle("active", x.id===btn.dataset.page));
    }));

    ["gross","fine","poolShares"].forEach(id => $(id).addEventListener("input", calculate));
    $("participants").addEventListener("change", calculate);
    $("arrested").addEventListener("change", calculate);

    $("addMember").addEventListener("click", e => withBusy(e.currentTarget,"追加中…",addMember));
    $("addCrime").addEventListener("click", e => withBusy(e.currentTarget,"追加中…",addCrime));
    $("saveCrime").addEventListener("click", e => withBusy(e.currentTarget,"保存中…",saveCrime));
    $("depositBtn").addEventListener("click", e => withBusy(e.currentTarget,"入金中…",() => poolTransaction("deposit")));
    $("withdrawBtn").addEventListener("click", e => withBusy(e.currentTarget,"出金中…",() => poolTransaction("withdraw")));
    $("resetAll").addEventListener("click", e => withBusy(e.currentTarget,"削除中…",resetAll));

    $("memberName").addEventListener("keydown", e => { if(e.key==="Enter") $("addMember").click(); });
    $("crimeName").addEventListener("keydown", e => { if(e.key==="Enter") $("addCrime").click(); });

    $("memberList").addEventListener("click", e => {
      const btn = e.target.closest(".delete-member");
      if (btn && confirm("このメンバーを削除しますか？")) withBusy(btn,"削除中…",() => deleteRow("members",btn.dataset.id));
    });
    $("crimeList").addEventListener("click", e => {
      const btn = e.target.closest(".delete-crime");
      if (btn && confirm("この犯罪種類を削除しますか？")) withBusy(btn,"削除中…",() => deleteRow("crime_types",btn.dataset.id));
    });

    document.querySelectorAll(".period-btn").forEach(btn => btn.addEventListener("click", () => {
      state.rankingPeriod = btn.dataset.period;
      document.querySelectorAll(".period-btn").forEach(x => x.classList.toggle("active",x===btn));
      renderRankings();
    }));
  }

  bind();
  loadAll();
  setInterval(loadAll, 30000);
})();
</script>
</body>
</html>
